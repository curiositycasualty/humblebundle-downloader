[project]
name = "humblebundle-downloader"
version = "0.6.0"
description = "Download your Humble Bundle library"
authors = [{ name = "Eddy Hintze", email = "eddy@gitx.codes" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.3",
    "parsel>=1.9.1",
    "rich>=14.0",
    "textual>=8.0",
]

[project.urls]
Homepage = "https://github.com/xtream1101/humblebundle-downloader"
Repository = "https://github.com/xtream1101/humblebundle-downloader"

[project.scripts]
hbd = "humblebundle_downloader.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["humblebundle_downloader", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Real errors only: undefined names, unused imports, likely bugs. The
# code formats its strings with .format() throughout, on purpose, so
# the style rules would only churn it
select = ["E4", "E7", "E9", "F", "B"]
